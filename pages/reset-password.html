<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>CSUPAK - Reset Password</title>
    <script>
        const takeResetCallback = (() => {
            let callback = location.hash;
            if (callback || location.search) {
                try {
                    history.replaceState(null, "", location.pathname);
                } catch {
                    callback = "";
                }
            }
            return () => {
                const value = callback;
                callback = "";
                return value;
            };
        })();
    </script>
    <link rel="stylesheet" href="../src/output.css">
</head>
<body class="min-h-screen bg-[#F3F5F3] flex items-center justify-center p-6">
    <main class="w-full max-w-5xl">
        <div class="grid overflow-hidden rounded-2xl bg-white shadow-xl md:grid-cols-2">
            <section class="relative bg-[#006B21] px-8 py-10 text-white md:px-12 md:py-16">
                <div class="absolute right-0 top-0 h-32 w-32 rounded-full bg-[#F5C400] opacity-10" aria-hidden="true"></div>
                <div class="relative flex h-full flex-col justify-between">
                    <div class="flex items-center gap-3">
                        <div class="h-10 w-1 rounded-full bg-[#F5C400]" aria-hidden="true"></div>
                        <div>
                            <p class="text-3xl font-bold tracking-tight">CSUPAK</p>
                            <p class="mt-0.5 text-xs text-green-100">Student Violation Tracking System</p>
                        </div>
                    </div>
                    <p class="mt-8 text-xs text-green-100">Caraga State University</p>
                </div>
            </section>

            <section class="px-8 py-10 md:px-12 md:py-16" aria-labelledby="reset-title">
                <div class="mx-auto max-w-md">
                    <h1 id="reset-title" tabindex="-1" class="text-3xl font-bold text-gray-800">Reset your password</h1>
                    <p id="reset-status" class="mt-2 mb-5 text-sm text-gray-700" role="status" aria-live="polite" aria-atomic="true">Checking your reset link…</p>

                    <form id="reset-password-form" class="space-y-5" hidden>
                        <p class="text-sm text-gray-700">Resetting the password for <strong id="reset-recipient"></strong></p>
                        <div>
                            <label for="reset-password" class="mb-2 block text-sm font-semibold text-gray-700">New password</label>
                            <input id="reset-password" type="password" autocomplete="new-password" required aria-describedby="reset-password-help" class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-3 text-gray-800 outline-none transition focus:border-[#006B21] focus:bg-white focus:ring-2 focus:ring-green-100">
                            <p id="reset-password-help" class="mt-2 text-sm text-gray-600">Use at least 8 characters. Additional password rules may apply.</p>
                            <button type="button" data-toggle-password="reset-password" aria-controls="reset-password" aria-label="Show new password" aria-pressed="false" class="mt-2 text-sm font-semibold text-[#006B21] hover:underline">Show password</button>
                        </div>
                        <div>
                            <label for="reset-confirm" class="mb-2 block text-sm font-semibold text-gray-700">Confirm new password</label>
                            <input id="reset-confirm" type="password" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 bg-gray-50 px-4 py-3 text-gray-800 outline-none transition focus:border-[#006B21] focus:bg-white focus:ring-2 focus:ring-green-100">
                            <button type="button" data-toggle-password="reset-confirm" aria-controls="reset-confirm" aria-label="Show confirm password" aria-pressed="false" class="mt-2 text-sm font-semibold text-[#006B21] hover:underline">Show password</button>
                        </div>
                        <button type="submit" class="w-full rounded-lg bg-[#006B21] px-4 py-3.5 font-semibold text-white shadow-sm transition hover:bg-[#005619]">Reset password</button>
                    </form>

                    <noscript><p class="text-sm text-gray-700">Enable JavaScript to reset your password.</p></noscript>
                    <p class="mt-8 border-t border-gray-200 pt-5"><a href="../index.html" class="text-sm font-semibold text-[#006B21] hover:underline">Return to login</a></p>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
    <script src="../js/supabase.js" data-supabase-config-only></script>
    <script type="module" src="../js/reset-password.mjs"></script>
</body>
</html>
